name: On-device AI Android build (slm-claude)

# Builds Android test APKs for the slm-claude on-device AI work (built-in Gemini Nano via ML Kit, and the
# downloadable llama.cpp fallback). Proves the native code compiles and links; it does not prove a model runs —
# that needs a physical phone (docs/APOLLO_ON_DEVICE_SLM.md, "Before release").
# Separate from the slm branch's "SLM Android native compile" workflow; the two branches are kept apart.

on:
  push:
    branches: [slm-claude]
    paths:
      - 'frontend/modules/apollo-slm/**'
      - 'frontend/src/slm/**'
      - 'frontend/src/components/OnDeviceAiNote.tsx'
      - 'frontend/app/settings/on-device-ai.tsx'
      - 'frontend/app.config.js'
      - 'frontend/package.json'
      - 'frontend/yarn.lock'
      - '.github/workflows/slm-claude-android.yml'
  pull_request:
    paths:
      - 'frontend/modules/apollo-slm/**'
      - 'frontend/src/slm/**'
      - 'frontend/app.config.js'
      - 'frontend/package.json'
      - 'frontend/yarn.lock'
      - '.github/workflows/slm-claude-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slm-claude-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble Android test APKs (debug + standalone)
    runs-on: ubuntu-24.04
    # The debug build alone took 25 min on run 42541622891 (llama.cpp compiles for every ABI); 45 min cut off the
    # standalone build.
    timeout-minutes: 100
    # The app's build-time settings, as the published app has them. EXPO_PUBLIC_BACKEND_URL is required: without it
    # the app stops at launch ("EXPO_PUBLIC_BACKEND_URL is not set", run 42550302561 on a test phone). It comes from
    # the repository variable EXPO_PUBLIC_BACKEND_URL (Settings → Secrets and variables → Actions → Variables), set by
    # the owner to the live production server. The GuardDog values match
    # native-dependencies.yml; without them the protection screens show "not configured".
    env:
      CI: '1'
      EXPO_PUBLIC_BACKEND_URL: ${{ vars.EXPO_PUBLIC_BACKEND_URL }}
      EXPO_PUBLIC_APP_ENV: production
      EXPO_PUBLIC_ANDROID_ENFORCEMENT_ENGINE: guarddog_production
      EXPO_PUBLIC_PREVIEW_BUILD: excluded
      EXPO_PUBLIC_GUARDDOG_RULE_BUNDLE_URL: https://threat-patrol-1.emergent.host/api/guarddog/rules
      EXPO_PUBLIC_GUARDDOG_CONTROLLED_HOST: apolloverify.harmonywellnessgroup.com.au
      EXPO_PUBLIC_GUARDDOG_CONTROLLED_IPV4: 52.25.179.131
      EXPO_PUBLIC_GUARDDOG_CONTROLLED_URL: https://apolloverify.harmonywellnessgroup.com.au/
      EXPO_PUBLIC_GUARDDOG_RULESET_ID: apollo-rules-v1
      APOLLO_ANDROID_RESTRICTED_PERMISSIONS: 'off'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Require the backend address
        run: |
          if [ -z "$EXPO_PUBLIC_BACKEND_URL" ]; then
            echo "::error::The repository variable EXPO_PUBLIC_BACKEND_URL is empty. Without it the app stops at launch."
            exit 1
          fi
          echo "Backend: $EXPO_PUBLIC_BACKEND_URL"
      - name: Install pinned frontend dependencies
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          # llama.rn's install script downloads prebuilt libraries from GitHub releases; a passing 504 there
          # (run 42578950717) shouldn't fail the build, so the install is tried up to 3 times, a minute apart.
          for attempt in 1 2 3; do
            yarn install --frozen-lockfile --non-interactive && exit 0
            echo "::warning::yarn install failed (attempt $attempt of 3)"; sleep 60
          done
          exit 1
      - name: Verify native dependency singletons
        run: node scripts/native-dependency-guard.cjs
      - name: On-device AI rule tests
        run: node --test tests/onDeviceSlm.test.ts tests/slmModels.test.ts
      - name: Prebuild Android project (generated, not committed)
        run: npx expo prebuild --platform android --clean --no-install --non-interactive
      # The generated gradle.properties gives Gradle 2 GB, which ran out while packaging the standalone APK
      # (OutOfMemoryError in ApkFlinger, run 42546148286). Test builds also target 64-bit ARM only: every recent
      # phone, and about a quarter of the llama.cpp native compile and APK size.
      - name: Tune the generated Gradle project for CI test builds
        run: |
          cd android
          sed -i '/^org.gradle.jvmargs=/d; /^reactNativeArchitectures=/d' gradle.properties
          printf '\n' >> gradle.properties   # the generated file has no trailing newline
          echo 'org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError' >> gradle.properties
          echo 'reactNativeArchitectures=arm64-v8a' >> gradle.properties
          grep -E '^(org.gradle.jvmargs|reactNativeArchitectures)=' gradle.properties
      - name: Check both on-device AI native modules are linked
        run: |
          cd android
          chmod +x gradlew
          # The first Gradle call downloads Gradle itself (services.gradle.org returned 504 once): up to 3 tries.
          for attempt in 1 2 3; do
            ./gradlew projects --no-daemon > ../gradle-projects.txt && break
            [ "$attempt" = 3 ] && exit 1
            echo "::warning::Gradle setup failed (attempt $attempt of 3)"; sleep 60
          done
          grep -q "apollo-slm" ../gradle-projects.txt || { echo "apollo-slm is not linked into the Android build"; exit 1; }
          grep -qi "llama" ../gradle-projects.txt || { echo "llama.rn is not linked into the Android build"; exit 1; }
      - name: Compile debug APK
        run: |
          cd android
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      # Saved straight away, so a slow or failed standalone build still leaves a debug APK to install.
      - name: Keep debug APK (needs Metro)
        uses: actions/upload-artifact@v4
        with:
          name: apollosg-slm-claude-android-debug
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
      - name: Compile standalone test APK (JavaScript bundled, debug-signed)
        run: |
          cd android
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Verify APKs carry the native libraries and bundled JavaScript
        run: |
          STANDALONE=android/app/build/outputs/apk/release/app-release.apk
          test -s "$STANDALONE"
          unzip -l "$STANDALONE" | grep -Eq 'assets/index.android.bundle|assets/.*\.hbc'
          # llama.cpp's native library must be packaged, or the downloaded model can never load.
          unzip -l "$STANDALONE" | grep -Eiq 'lib/arm64-v8a/.*rnllama.*\.so'
          echo "APKs built. No model is bundled; no on-device inference has been run in CI."
      - name: Keep standalone test APK (runs without Metro)
        uses: actions/upload-artifact@v4
        with:
          name: apollosg-slm-claude-android-standalone-test
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
          if-no-files-found: error
