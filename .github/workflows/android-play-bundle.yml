name: ApolloSG Google Play bundle

on:
  push:
    branches: [slm]
    paths:
      - 'frontend/**'
      - '.github/workflows/android-play-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  play-bundle:
    runs-on: ubuntu-latest
    if: ${{ vars.APOLLO_SLM_BUILD_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install pinned frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile --non-interactive
      - name: Validate types and Android build admission
        working-directory: frontend
        run: |
          yarn tsc --noEmit
          node --test tests/androidAbiConfig.test.cjs tests/nativeDependencyGuard.test.cjs
          python3 -m unittest discover -s tests -p test_android_abis.py
      - name: Validate EAS credentials
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is required for the existing EAS project"
            exit 1
          fi
      - name: Build signed Google Play AAB and inspect its native code
        working-directory: frontend
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: '1'
        run: |
          npx --yes eas-cli@latest build --platform android --profile production --non-interactive --wait --json > /tmp/eas-play-result.json
          python3 scripts/verify_android_abis.py --eas-result /tmp/eas-play-result.json
          node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync("/tmp/eas-play-result.json","utf8"));const b=Array.isArray(r)?r[0]:r;fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,"Verified Google Play AAB: "+b.artifacts.buildUrl+"\nAwaiting Play Console upload, device targeting and release verification.\n");'
