name: SLM Android native prebuild smoke

on:
  push:
    branches: [slm]
    paths:
      - 'frontend/app.config.js'
      - 'frontend/package.json'
      - 'frontend/yarn.lock'
      - 'frontend/src/domain/slm/**'
      - '.github/workflows/slm-native-prebuild.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-prebuild:
    name: Expo Android CNG (SLM opt-in)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      APOLLO_SLM_NATIVE: "on"
      EXPO_PUBLIC_APP_ENV: development
      EXPO_PUBLIC_PREVIEW_BUILD: excluded
      APOLLO_ANDROID_RESTRICTED_PERMISSIONS: "off"
      CI: "1"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned Yarn dependencies
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile --non-interactive
      - name: Enforce existing native dependency guard
        run: node scripts/native-dependency-guard.cjs
      - name: Generate native Android project (no build, no tracked artifacts)
        run: npx expo prebuild --platform android --clean --no-install --non-interactive
      - name: Verify actual llama.rn native registration
        run: |
          test -d android
          test -d node_modules/llama.rn/android
          grep -Rql 'llama.rn\|rnllama' android/settings.gradle android/app/build.gradle android/gradle.properties android/app/src/main 2>/dev/null || echo "No direct text evidence; CNG may use autolinking during Gradle build."
          echo "Prebuild generated; physical-device inference and Gradle compile remain unverified."
      - name: Ensure generated native files remain untracked
        run: |
          if test -n "$(git status --porcelain --untracked-files=normal | grep -E '^.. (android|ios)/' || true)"; then
            echo "Generated native files are present locally as expected and are not committed."
          fi
