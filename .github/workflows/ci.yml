# ApolloSG — CI
#
# Runs on every push to main and every pull request into main:
#   1. secret-scan     — gitleaks over the history.
#   2. backend-tests   — boots the real FastAPI backend against an empty MongoDB and runs backend/tests.
#   3. frontend-checks — expo lint and tsc, failing only on issues that aren't in the committed baselines.
#
# The backend needs no seeded data: the suite registers its own devices through /api/devices/register
# (tests/conftest.py). No paid or keyed service is used: no provider keys are set, and
# APOLLO_FORBID_PROVIDER_CALLS=1 makes the AI gateway and Brave search refuse to send anything. The backend's own
# background jobs still fetch free public threat and government feeds at start-up, as they do in production.
# Tests marked credentialed_integration are skipped (they need APOLLO_RUN_CREDENTIALED_INTEGRATION=1 and real keys).
#
# The two secrets the backend requires at start-up are generated fresh for each run and thrown away:
# URL_HMAC_SECRET and the investigation key file. No GitHub secrets are needed.
#
# Native builds are covered by the separate native-dependencies.yml workflow (and per-branch Android builds).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-tests:
    name: Backend pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: apollo_ci
      EXPO_PUBLIC_BACKEND_URL: http://localhost:8001
      CORS_ORIGINS: "*"
      APOLLO_FORBID_PROVIDER_CALLS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          # emergentintegrations and the custom litellm wheel come from Emergent-internal URLs CI can't reach.
          # Production code doesn't import them; one test helper imports emergentintegrations lazily inside a
          # credentialed evaluation function only.
          grep -v '^emergentintegrations' backend/requirements.txt | grep -v '^litellm' > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
      - name: Generate throwaway start-up secrets
        run: |
          echo "URL_HMAC_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          KEY_FILE="$RUNNER_TEMP/investigation.key"
          openssl rand -hex 32 > "$KEY_FILE"
          chmod 600 "$KEY_FILE"   # the encryption service refuses a key file others can read
          echo "INVESTIGATION_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"
      - name: Start backend (uvicorn)
        run: |
          cd backend
          nohup python -m uvicorn server:app --host 0.0.0.0 --port 8001 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do
            # FastAPI serves its schema at /openapi.json (ApolloSG's routes are under /api, the schema isn't).
            if curl -sf http://localhost:8001/openapi.json > /dev/null; then
              echo "backend is up"; exit 0
            fi
            sleep 2
          done
          echo "backend failed to become healthy — dumping log"; cat /tmp/backend.log; exit 1
      - name: Run backend test suite
        run: |
          cd backend
          python -m pytest tests/ -q --no-header
      - name: Upload backend log (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: /tmp/backend.log
          if-no-files-found: ignore

  frontend-checks:
    name: Frontend lint + typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable corepack (pinned Yarn)
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile --non-interactive
      # BASELINES (frontend/eslint-suppressions.json, frontend/tsc-baseline.txt): this gate was added to an existing
      # codebase, so the issues already on main on 2026-11-09 are recorded once and CI fails only on new ones.
      # Fix issues at the source and regenerate to shrink them; never add entries to get a change through.
      #   Lint:  npx eslint src app --suppress-all --suppressions-location eslint-suppressions.json
      #          (after fixing, `--prune-suppressions` drops entries that no longer occur)
      #   Types: npx tsc --noEmit | grep -E '^\S+\.tsx?\(' | sed -E 's/\([0-9]+,[0-9]+\)//; s#import\("[^"]*/frontend/#import("#g' | sort -u > tsc-baseline.txt
      # The type baseline has no line numbers, so editing a file doesn't make its old errors look new, and no absolute
      # paths (tsc writes them inside import("…") types), so it matches on any machine.
      - name: Lint (new issues only — see baseline note above)
        run: npx expo lint -- --suppressions-location eslint-suppressions.json
      - name: Type check (new errors only — see baseline note above)
        run: |
          npx tsc --noEmit > /tmp/tsc-actual.txt 2>&1 || true
          grep -E '^\S+\.tsx?\(' /tmp/tsc-actual.txt | sed -E 's/\([0-9]+,[0-9]+\)//; s#import\("[^"]*/frontend/#import("#g' | sort -u > /tmp/tsc-actual-sorted.txt
          sort -u tsc-baseline.txt > /tmp/tsc-baseline-sorted.txt
          NEW_ERRORS=$(comm -13 /tmp/tsc-baseline-sorted.txt /tmp/tsc-actual-sorted.txt)
          if [ -n "$NEW_ERRORS" ]; then
            echo "New TypeScript errors (not in tsc-baseline.txt):"
            echo "$NEW_ERRORS"
            exit 1
          fi
          echo "No new TypeScript errors. ($(wc -l < /tmp/tsc-actual-sorted.txt) baselined, ignored.)"
