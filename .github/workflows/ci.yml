name: ApolloSG regression gate
on:
  push:
    branches: [main, master, slm]
  pull_request:
    branches: [main, master, slm]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: yarn install --frozen-lockfile --ignore-scripts --non-interactive
        working-directory: frontend
      - name: Type-check the complete frontend
        run: yarn tsc --noEmit
        working-directory: frontend
      - name: SLM, triage parity, evidence integrity and protection truth
        run: node --test tests/slm*.test.ts tests/slmModelIntegrity.test.cjs tests/wright*.test.ts tests/triage.test.ts tests/evidenceArchive.test.ts tests/protectionTruth.test.ts tests/caseEvidence.test.ts tests/screenedCalls.test.ts tests/screenedCarrierVerification.test.ts tests/diTrace.test.ts tests/reportSections.test.ts tests/appReport.test.ts tests/nativeDependencyGuard.test.cjs
        working-directory: frontend
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: apollosg_ci_isolated
      EXPO_PUBLIC_BACKEND_URL: http://127.0.0.1:18765
      URL_HMAC_SECRET: ci-test-only-not-a-production-key
      APOLLO_FORBID_PROVIDER_CALLS: '1'
      GOOGLE_WEB_RISK_ENABLED: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install declared dependencies without private distribution packages
        run: |
          grep -v '^emergentintegrations' backend/requirements.txt | grep -v '^litellm' > /tmp/apollo-ci-requirements.txt
          python -m pip install -r /tmp/apollo-ci-requirements.txt
      - name: Generate a disposable investigation encryption key
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from cryptography.fernet import Fernet
          path = Path(os.environ['RUNNER_TEMP']) / 'apollo-investigation.key'
          path.write_bytes(Fernet.generate_key())
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('INVESTIGATION_KEY_FILE=' + str(path) + '\n')
          PY
      - name: Compile every backend Python file without executing it
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for path in Path('backend').rglob('*.py'):
              compile(ast.parse(path.read_text(), filename=str(path)), str(path), 'exec')
          PY
      - name: App import, ownership, evidence pickup, deletion, recovery and SLM regressions
        working-directory: backend
        run: >-
          python -m pytest -q
          tests/test_review_repairs.py tests/test_device_pickup.py tests/test_recovery_fencing.py
          tests/test_slm_contract.py tests/test_slm_advisory_stage.py tests/test_slm_wait_deadline.py
          tests/test_slm_replay.py tests/test_slm_evidence_coverage.py tests/test_slm_redundancy_regression.py
          tests/test_slm_mandatory_behaviour.py tests/test_previous_reports.py tests/test_magnum_continuation.py
          tests/test_google_web_risk_staged.py tests/test_wright_phase6_contract.py
          tests/test_phase7_investigation_safeguards.py
          tests/test_findings_scoring.py tests/test_evidence_evaluation.py tests/test_taxonomy.py
          tests/test_wright_evidence_windows.py tests/test_wright_window_synthesis.py tests/test_verified_businesses.py
          tests/test_evidence_verdict_reconciliation.py tests/test_magnum_floor_resolver.py
          tests/test_sg_definite_scam.py tests/test_brand_domains.py tests/test_higgins_wording.py
          tests/test_prd_slm_integration.py
          tests/test_calibration_reference_library.py tests/test_wright_message_calibration.py
