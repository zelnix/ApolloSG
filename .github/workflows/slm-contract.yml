name: SLM contract tests

on:
  push:
    branches: [slm]
    paths:
      - 'frontend/src/domain/slm/**'
      - 'frontend/app/_layout.tsx'
      - 'frontend/src/higgins/slmExplanation.ts'
      - 'frontend/src/higgins/chatClient.ts'
      - 'backend/services/higgins/slm_contract.py'
      - 'backend/services/higgins/slm_advisory.py'
      - 'backend/services/higgins/coordinator.py'
      - 'frontend/src/investigation/caseStore.ts'
      - 'frontend/src/investigation/types.ts'
      - 'backend/tests/test_slm_advisory_stage.py'
      - 'backend/tests/test_slm_wait_deadline.py'
      - 'backend/tests/test_slm_replay.py'
      - 'backend/tests/test_higgins_escalation_contract.py'
      - 'backend/tests/test_slm_contract.py'
      - 'backend/tests/test_slm_redundancy_regression.py'
      - 'backend/tests/test_slm_mandatory_behaviour.py'
      - 'backend/tests/test_no_evidence_lock_stage.py'
      - 'backend/routers/slm_handoff.py'
      - 'backend/routers/investigations.py'
      - 'frontend/src/domain/privacy.ts'
      - 'frontend/tests/slm*.test.ts'
      - 'frontend/tests/slm*.test.cjs'
      - 'frontend/scripts/slm-verify-gguf.cjs'
      - '.github/workflows/slm-contract.yml'
  pull_request:
    paths:
      - 'frontend/src/domain/slm/**'
      - 'frontend/tests/slm*.test.ts'
      - '.github/workflows/slm-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slm-contract:
    name: Local SLM contract (no native model)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned frontend dependencies
        working-directory: frontend
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile --ignore-scripts --non-interactive
      - name: Run SLM contract and isolation tests
        working-directory: frontend
        run: |
          node --test tests/slm.test.ts tests/slmRuntime.test.ts tests/slmNativeBridge.test.ts tests/slmModelIntegrity.test.cjs tests/slmCaseContract.test.ts tests/slmAskHiggins.test.ts tests/slmModelAdmission.test.ts
      - name: Type-check SLM source without hiding other project errors
        working-directory: frontend
        run: |
          npx tsc --noEmit > /tmp/slm-tsc-actual.txt 2>&1 || true
          grep -E '^(src/domain/slm/|src/higgins/slmExplanation\\.ts|src/higgins/chatClient\\.ts|src/investigation/(caseStore|types)\\.ts|app/_layout\\.tsx|tests/slm)' /tmp/slm-tsc-actual.txt > /tmp/slm-tsc-errors.txt || true
          if [ -s /tmp/slm-tsc-errors.txt ]; then
            echo "SLM TypeScript errors:"
            cat /tmp/slm-tsc-errors.txt
            exit 1
          fi
          echo "No TypeScript errors reported in SLM source or tests."
          echo "Note: this check does not assert the existing full project is error-free."

  backend-slm-contract:
    name: Backend advisory contract (no database)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install contract-test dependencies
        run: python -m pip install 'pydantic>=2,<3' 'pytest>=8,<10' 'pytest-xdist>=3,<5' 'requests>=2,<3'
      - name: Test backend case correlation and evidence integrity
        working-directory: backend
        run: |
          PYTHONPATH=. python tests/test_slm_contract.py
          PYTHONPATH=. python tests/test_slm_advisory_stage.py
          PYTHONPATH=. python tests/test_slm_wait_deadline.py
          PYTHONPATH=. python tests/test_slm_replay.py
          PYTHONPATH=. python tests/test_slm_redundancy_regression.py
          PYTHONPATH=. python tests/test_slm_mandatory_behaviour.py
          python -c "import runpy; t = runpy.run_path('tests/test_no_evidence_lock_stage.py'); t['test_investigation_coordinator_has_no_evidence_lock_stage'](); t['test_existing_evidence_and_findings_persistence_are_retained'](); print('Evidence Lock regression: 2 passed')"
          python -c "import runpy; t = runpy.run_path('tests/test_higgins_escalation_contract.py'); [t[name]() for name in sorted(t) if name.startswith('test_')]; print('Higgins escalation regression: 4 passed')"
          python -m py_compile routers/slm_handoff.py routers/investigations.py services/higgins/slm_contract.py services/higgins/slm_advisory.py services/higgins/coordinator.py
