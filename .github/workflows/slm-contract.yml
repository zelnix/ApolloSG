name: SLM contract tests

on:
  push:
    branches: [slm]
    paths:
      - 'frontend/src/domain/slm/**'
      - 'frontend/tests/slm*.test.ts'
      - 'frontend/tests/slm*.test.cjs'
      - 'frontend/scripts/slm-verify-gguf.cjs'
      - '.github/workflows/slm-contract.yml'
  pull_request:
    paths:
      - 'frontend/src/domain/slm/**'
      - 'frontend/tests/slm*.test.ts'
      - '.github/workflows/slm-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slm-contract:
    name: Local SLM contract (no native model)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned frontend dependencies
        working-directory: frontend
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile --ignore-scripts --non-interactive
      - name: Run SLM contract and isolation tests
        working-directory: frontend
        run: |
          node --test tests/slm.test.ts tests/slmRuntime.test.ts tests/slmNativeBridge.test.ts tests/slmModelIntegrity.test.cjs
      - name: Type-check SLM source without hiding other project errors
        working-directory: frontend
        run: |
          npx tsc --noEmit > /tmp/slm-tsc-actual.txt 2>&1 || true
          grep -E '^(src/domain/slm/|tests/slm)' /tmp/slm-tsc-actual.txt > /tmp/slm-tsc-errors.txt || true
          if [ -s /tmp/slm-tsc-errors.txt ]; then
            echo "SLM TypeScript errors:"
            cat /tmp/slm-tsc-errors.txt
            exit 1
          fi
          echo "No TypeScript errors reported in SLM source or tests."
          echo "Note: this check does not assert the existing full project is error-free."
