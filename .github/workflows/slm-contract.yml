name: SLM contract tests

on:
  push:
    branches: [slm]
    paths:
      - 'frontend/src/domain/slm/**'
      - 'frontend/tests/slm*.test.ts'
      - '.github/workflows/slm-contract.yml'
  pull_request:
    paths:
      - 'frontend/src/domain/slm/**'
      - 'frontend/tests/slm*.test.ts'
      - '.github/workflows/slm-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slm-contract:
    name: Local SLM contract (no native model)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned frontend dependencies
        working-directory: frontend
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile --ignore-scripts --non-interactive
      - name: Run SLM contract and isolation tests
        working-directory: frontend
        run: |
          node --test tests/slm.test.ts tests/slmRuntime.test.ts tests/slmNativeBridge.test.ts
      - name: Check for new TypeScript errors against existing baseline
        working-directory: frontend
        run: |
          npx tsc --noEmit > /tmp/slm-tsc-actual.txt 2>&1 || true
          grep -E '^\\S+\\.tsx?\\(' /tmp/slm-tsc-actual.txt | sort -u > /tmp/slm-tsc-sorted.txt || true
          sort -u tsc-baseline.txt > /tmp/slm-tsc-baseline.txt
          NEW_ERRORS=$(comm -13 /tmp/slm-tsc-baseline.txt /tmp/slm-tsc-sorted.txt)
          if [ -n "$NEW_ERRORS" ]; then
            echo "New TypeScript errors:"
            echo "$NEW_ERRORS"
            exit 1
          fi
          echo "No new TypeScript errors."
