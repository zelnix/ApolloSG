name: SLM Android native compile
# Standalone APK build requested for slm physical-device acceptance.

on:
  push:
    branches: [slm]
    paths:
      - 'frontend/**'
      - '!frontend/tests/**'
      - '!frontend/scripts/verify_android_abis.py'
      - 'backend/services/google_web_risk.py'
      - 'backend/services/virustotal.py'
      - 'backend/services/virustotal_url.py'
  workflow_dispatch:
    inputs:
      build_debug:
        description: 'Also build a Metro-dependent debug APK for troubleshooting'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  compile:
    name: Assemble standalone Android SLM test APK (optional debug)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: '1'
      APOLLO_SLM_NATIVE: 'on'
      # Explicitly scoped to this standalone slm test APK; never a general store-release default.
      EXPO_PUBLIC_SLM_TEST_MODE: 'true'
      EXPO_PUBLIC_APP_ENV: production
      EXPO_PUBLIC_ANDROID_ENFORCEMENT_ENGINE: guarddog_production
      EXPO_PUBLIC_GUARDDOG_RULE_BUNDLE_URL: https://threat-patrol-1.emergent.host/api/guarddog/rules
      EXPO_PUBLIC_GUARDDOG_CONTROLLED_HOST: apolloverify.harmonywellnessgroup.com.au
      EXPO_PUBLIC_GUARDDOG_CONTROLLED_IPV4: 52.25.179.131
      EXPO_PUBLIC_GUARDDOG_CONTROLLED_URL: https://apolloverify.harmonywellnessgroup.com.au/
      EXPO_PUBLIC_GUARDDOG_RULESET_ID: apollo-rules-v1
      EXPO_PUBLIC_PREVIEW_BUILD: excluded
      APOLLO_ANDROID_RESTRICTED_PERMISSIONS: 'off'
      EXPO_PUBLIC_BACKEND_URL: ${{ vars.EXPO_PUBLIC_BACKEND_URL }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned frontend dependencies
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile --non-interactive
      - name: Verify native dependency singletons
        run: node scripts/native-dependency-guard.cjs
      - name: Verify standalone backend configuration
        run: |
          if [ -z "$EXPO_PUBLIC_BACKEND_URL" ]; then
            echo '::error::EXPO_PUBLIC_BACKEND_URL is missing. Configure the existing GitHub Actions repository variable before building the standalone APK.'
            exit 1
          fi
          case "$EXPO_PUBLIC_BACKEND_URL" in
            https://*) ;;
            *) echo '::error::EXPO_PUBLIC_BACKEND_URL must be an HTTPS URL.'; exit 1 ;;
          esac
      - name: Prebuild Android project without checking generated native code into Git
        run: npx expo prebuild --platform android --clean --no-install --non-interactive
      - name: Compile native Android debug APK (manual opt-in)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_debug }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8' --stacktrace
      - name: Compile standalone Android test APK with bundled JavaScript
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8' --stacktrace
      - name: Verify standalone APK and embedded JavaScript
        run: |
          test -s android/app/build/outputs/apk/release/app-release.apk
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -Eq 'assets/index.android.bundle|assets/.*\.hbc'
          # A build with no embedded JS must never be labelled as a standalone test APK.
          echo "Standalone release APK has embedded JavaScript."
          echo "Model candidate remains disabled in release builds; no physical-device inference has been performed."
      - name: Reject unsupported native code before publishing the scoped test APK
        run: python3 scripts/verify_android_abis.py android/app/build/outputs/apk/release/app-release.apk --expected-abi arm64-v8a
      - name: Verify optional debug APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_debug }}
        run: python3 scripts/verify_android_abis.py android/app/build/outputs/apk/debug/app-debug.apk --expected-abi arm64-v8a
      - name: Retain debug APK for controlled physical-device testing
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_debug }}
        uses: actions/upload-artifact@v4
        with:
          name: apollosg-slm-android-debug
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
          if-no-files-found: error
      - name: Retain standalone APK for splash/boot acceptance without Metro
        uses: actions/upload-artifact@v4
        with:
          name: apollosg-slm-android-standalone-test
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 3
          if-no-files-found: error
