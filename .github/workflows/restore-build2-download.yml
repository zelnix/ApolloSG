name: Restore completed APK download
on:
  push:
    branches: [apk-delivery-build2]
    paths: ['.github/workflows/restore-build2-download.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: restore-apk-build2-download
  cancel-in-progress: false
jobs:
  publish-existing-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ApolloSG-1.1.0-build2-arm64
          run-id: 43442095523
          github-token: ${{ github.token }}
          path: delivery
      - name: Verify the recovered APK
        run: |
          echo '52e2b809c3fdc5bb741c2dcdbdad9c31deb68a68b9fe8ff557090e6b8d18991a  delivery/ApolloSG-1.1.0-build2-arm64.apk' | sha256sum --check -
      - name: Publish durable direct download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > delivery/notes.txt <<'NOTES'
          ApolloSG 1.1.0, build 2 — ARM64 internal testing APK.

          This restores the exact APK already compiled from commit 773b624acb1944e7b50f3f62161352088f660652. No new Android or Expo build was performed. The release tag records the delivery workflow; the APK source commit is listed above.

          Includes the on-device model installer/startup fixes. Uses the same GitHub test signing identity as the previous APK and can be installed as an update. Physical Galaxy Z Fold6 validation is still pending.

          APK SHA-256: 52e2b809c3fdc5bb741c2dcdbdad9c31deb68a68b9fe8ff557090e6b8d18991a

          Automatic APK builds remain paused.
          NOTES
          gh release create apk-v1.1.0-build2 \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "ApolloSG 1.1.0 build 2 — ARM64 internal test" \
            --notes-file delivery/notes.txt \
            delivery/ApolloSG-1.1.0-build2-arm64.apk \
            delivery/ApolloSG-1.1.0-build2-arm64.apk.sha256
