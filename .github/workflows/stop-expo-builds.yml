name: Stop requested Expo builds

on:
  push:
    branches: [slm]
    paths: ['.github/workflows/stop-expo-builds.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cancel-requested-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Load the existing project configuration without running builds
        working-directory: frontend
        run: yarn install --frozen-lockfile --ignore-scripts --non-interactive
      - name: Cancel only this session's active Expo builds
        working-directory: frontend
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: '1'
        run: |
          node -e 'if(require("./app.config.js").expo.extra.eas.projectId!=="b2eb337d-2687-46bf-b1cc-292d30c0b601")throw Error("Unexpected Expo project; cancellation refused");'
          npx --yes eas-cli@latest build:list --platform android --limit 20 --json --non-interactive > /tmp/apollo-builds-to-stop.json
          node -e 'const fs=require("fs");const builds=JSON.parse(fs.readFileSync("/tmp/apollo-builds-to-stop.json","utf8"));const commits=new Set(["d6627ac64344b9c0d4380d002d004abbc074362c","fca6f5ae9ae7b89cc3adfc87087d4ab4251431c1"]);const ids=builds.filter(b=>commits.has(b.gitCommitHash)&&["NEW","IN_QUEUE","IN_PROGRESS"].includes(b.status)).map(b=>b.id);if(ids.some(id=>!/^[0-9a-f-]{36}$/.test(id)))throw Error("Invalid build ID");fs.writeFileSync("/tmp/apollo-builds-to-stop.txt",ids.length?ids.join("\n")+"\n":"");console.log("Matching active builds: "+ids.length);'
          while IFS= read -r apollo_build_id; do
            npx --yes eas-cli@latest build:cancel "$apollo_build_id" --non-interactive
          done < /tmp/apollo-builds-to-stop.txt
